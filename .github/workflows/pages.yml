name: Play on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/tests/engine.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage original browser game
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/icon.svg web/app.mjs web/core.mjs web/session.mjs _site/
          cp LICENSE _site/LICENSE.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
