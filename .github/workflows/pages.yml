name: Play on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'src/MeadowPeaks.csproj', 'scripts/package_web.py', 'LICENSE', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test web/tests/*.test.mjs
      - name: Verify complete chapter artwork
        run: node scripts/validate_chapter_collection.mjs
      - uses: actions/configure-pages@v5
      - name: Stage original browser game
        run: |
          python scripts/package_web.py
          python -m zipfile -e artifacts/MeadowPeaks-web.zip _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
