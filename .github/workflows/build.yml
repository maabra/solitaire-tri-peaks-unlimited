name: Windows build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test, publish, and smoke test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build and smoke test single EXE
        shell: pwsh
        run: ./scripts/build-single-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MeadowPeaks-win-x64
          path: |
            artifacts/MeadowPeaks-win-x64.zip
            artifacts/MeadowPeaks.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeadowPeaks-win-x64
      - name: Attach Windows game to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" MeadowPeaks.exe MeadowPeaks-win-x64.zip --title "Meadow Peaks $RELEASE_TAG" --generate-notes
