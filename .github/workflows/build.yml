name: Windows build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify browser content generated from C#
        run: dotnet run --project tools/MeadowPeaks.ContentExporter -- --check .
      - name: Verify complete chapter artwork
        run: node scripts/validate_chapter_collection.mjs
      - name: Verify shared browser engine and save compatibility
        run: node --test web/tests/*.test.mjs
      - name: Verify mutation-aware campaign deals
        run: node scripts/verify_adventure_deals.mjs
      - name: Verify all long garden deals
        run: node scripts/verify_long_deals.mjs
      - name: Prepare portable shared renderer
        shell: pwsh
        run: ./scripts/prepare_webview_runtime.ps1
      - name: Verify story layouts and cooldowns
        shell: pwsh
        run: dotnet run --project tests/MeadowPeaks.Tests.csproj -c Release -- --story-all
      - name: Test, publish, and smoke test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build and smoke test single EXE
        shell: pwsh
        run: ./scripts/build-single-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MeadowPeaks-win-x64
          compression-level: 0
          path: |
            artifacts/MeadowPeaks-win-x64.zip
            artifacts/MeadowPeaks.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeadowPeaks-win-x64
      - name: Attach Windows game to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; Windows build and smoke checks passed."
          else
            gh release create "$RELEASE_TAG" MeadowPeaks.exe MeadowPeaks-win-x64.zip --title "Meadow Peaks $RELEASE_TAG" --generate-notes
          fi
